<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#1B2A23">
  <meta name="description" content="天快黑了，集合点还少一个人。走进十六个这样的片刻，看看《进击的巨人》里，谁会和你做相似的事。">
  <title>进击的巨人｜人物侧影测试</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231b2a23'/%3E%3Cpath d='M14 18h36v8H14zm4 14h28v8H18zm6 14h16v6H24z' fill='%23d5c399'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="page-shell">
    <header class="topbar">
      <a class="brand" href="#introScreen">
        <span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i></span>
        <span data-ui="brand">进击的巨人 · 人物侧影</span>
      </a>
    </header>
    <main id="app">
      <section class="screen intro-screen" id="introScreen" aria-labelledby="introTitle">
        <div class="intro-copy">
          <h1 id="introTitle" data-ui="homeTitle" tabindex="-1">如果你也在墙内</h1>
          <p class="intro-lead" data-ui="homeIntro">天快黑了，集合点还少一个人。走进十六个这样的片刻，看看《进击的巨人》里，谁会和你做相似的事。</p>
          <div class="intro-actions">
            <button class="primary-button" id="startButton" data-ui="start" type="button">开始测试</button>
            <span class="intro-meta" data-ui="homeMeta">16 个处境 · 约 5 分钟</span>
          </div>
          <div class="draft-actions" id="draftActions" hidden>
            <button class="text-button" id="newRunButton" data-ui="newRun" type="button">从头开始</button>
            <span class="intro-meta" id="localProgress" data-ui="localProgress">进度保存在这台设备上</span>
          </div>
          <p class="spoiler-notice" data-ui="homeSpoilers">结果含人物姓名与过往。关键剧情可自行展开。</p>
        </div>
        <div class="intro-portrait" aria-hidden="true">
          <img src="assets/chibi/armin.png" alt="" width="1024" height="1536" fetchpriority="high">
        </div>
      </section>

      <section class="screen quiz-screen" id="quizScreen" aria-labelledby="questionText" hidden>
        <div class="question-topline">
          <span class="progress-number" id="currentNumber">01 / 16</span>
          <button class="text-button" id="exitButton" data-ui="saveExit" type="button">暂存并返回</button>
        </div>
        <div class="progress-track" aria-hidden="true"><span id="progressBar"></span></div>
        <h2 id="questionText" tabindex="-1"></h2>
        <fieldset class="answer-list" id="answerList">
          <legend data-ui="questionHint">选你当时最可能做的事。</legend>
        </fieldset>
        <div class="quiz-footer">
          <button class="secondary-button" id="prevButton" data-ui="prev" type="button">上一题</button>
          <button class="primary-button" id="nextButton" data-ui="next" type="button" disabled>下一题</button>
          <span class="keyboard-hint" data-ui="keyboardHint">数字键 1–4 选择，Enter 继续</span>
        </div>
      </section>

      <article class="screen result-screen" id="resultScreen" aria-labelledby="resultTitle" hidden>
        <header class="result-reveal">
          <div class="result-copy">
            <p class="result-label" data-ui="resultLabel">与你相似的人</p>
            <h1 id="resultTitle" tabindex="-1"></h1>
            <p class="result-lead" id="resultLead"></p>
          </div>
          <div class="character-stage" id="characterStage">
            <img id="resultCharacter" alt="" width="1024" height="1536">
          </div>
        </header>
        <div class="result-content">
          <section class="reading-section">
            <h2 data-ui="readerTitle">写给你</h2>
            <div id="readerText"></div>
          </section>
          <section class="reading-section portrait-section">
            <h2 id="portraitTitle"></h2>
            <div id="portraitText"></div>
          </section>
          <details class="spoiler-panel" id="spoilerPanel">
            <summary data-ui="spoilerLabel">继续读 · 含关键剧情</summary>
            <div id="spoilerText"></div>
          </details>
          <div class="result-actions">
            <button class="primary-button" id="saveCardButton" data-ui="saveCard" type="button">保存人物卡</button>
            <button class="secondary-button" id="copyButton" data-ui="copy" type="button">复制结果</button>
            <button class="text-button" id="restartButton" data-ui="restart" type="button">重新测试</button>
          </div>
          <p class="result-status" id="toast" role="status"></p>
          <div class="copy-fallback" id="copyFallback" hidden>
            <p id="copyFallbackLabel" data-ui="copyFallback">可以选中下方文字复制</p>
            <textarea id="copyText" rows="4" aria-labelledby="copyFallbackLabel" readonly></textarea>
          </div>
        </div>
      </article>
    </main>
    <footer class="site-footer" data-ui="credit">《进击的巨人》非官方同人测试 · 原作 谏山创</footer>
  </div>
  <canvas id="shareCanvas" width="1080" height="1440" hidden></canvas>
  <script src="copy.js"></script>
  <script src="app.js"></script>
</body>
</html>
